plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version '1.19-SNAPSHOT'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    flatDir {
        dir 'libs'
    }

    maven { url = "https://maven.enginehub.org/repo/" }
    maven {
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven { url = "https://maven.theillusivec4.top" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.kosmx.dev/" }
    maven { url = "https://maven.wispforest.io/releases" }
    maven { url = "https://maven.su5ed.dev/releases" }
    maven { url = "https://maven.fabricmc.net" }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {
    // FABRIC ******************************************************************************************************
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // GECKOLIB ***************************************************************************************************
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

    // PLAYER ANIMATOR ********************************************************************************************
    //compileOnly "dev.kosmx.player-anim:player-animation-lib-fabric:${player_animator_version}"
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${player_animator_version}"

    // ACCESSORIES ************************************************************************************************
    modImplementation "io.wispforest:accessories-fabric:${accessories_version}"

    // JEI ********************************************************************************************************
    compileOnly "mezz.jei:jei-${jei_mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_mc_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_mc_version}-fabric:${jei_version}"

//    runtimeOnly "curse.maven:atlasviewer-633577:6088094"

//    localRuntime "curse.maven:better-combat-by-daedelus-639842:6532547"
//    localRuntime "curse.maven:cloth-config-348521:5729127"

//    runtimeOnly "curse.maven:spark-361579:6225208"


    // PATCHOULI **************************************************************************************************
//    localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}-FABRIC"

//    localRuntime "curse.maven:placebo-283644:6446766"
//    localRuntime "curse.maven:apothic-attributes-898963:6302334"
//    localRuntime "curse.maven:irons-jewelry-1101111:5943490"
//    localRuntime "curse.maven:atlas-api-1145462:5940096"

    //QOL
//    localRuntime "curse.maven:tslatentitystatus-tes-830420:6041374"
//    localRuntime "curse.maven:mouse-tweaks-60089:5637846"

    // JSON ******************************************************************************************************
    implementation "com.google.code.gson:gson:${gson_version}"

    // LOCAL LIBS FOR TESTING (put the jar in /libs/ folder

    //jarJar(implementation("ignored:defaultresources-forge:1.19.2-0.3.0"))) {
    //    jarJar.ranged(it, "[0.3.0,)")
    //}
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            geckolib_version       : geckolib_version,
            player_animator_version: player_animator_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description,
            mod_display_url        : mod_display_url,
            mod_issue_tracker      : mod_issue_tracker,
            mod_logo_file          : mod_logo_file
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
    exclude('**/*.psd')
    exclude('**/*.bbmodel')
}

java {
    withSourcesJar()
    //withJavadocJar()
}

tasks.register('apiJar', Jar) {
    archiveClassifier.set('api')
    include 'io/redspace/ironsspellbooks/api/**/*'
    from sourceSets.main.allSource
    from sourceSets.main.output
}

artifacts {
    archives apiJar
    archives sourcesJar
}

publishing {
    tasks.publish.dependsOn 'build'
    publications {

        mavenJava(MavenPublication) {
            artifactId mod_id
            artifact jar
            artifact sourcesJar
            artifact apiJar
        }
    }

    repositories {
        maven {
            name = "redspace"

            if (project.version.endsWith('-SNAPSHOT')) {
                url uri("https://code.redspace.io/snapshots")
            } else {
                url uri("https://code.redspace.io/releases")
            }

            credentials {
                username = System.getenv("MAVEN_USER")
                password = System.getenv("MAVEN_PASS")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('copyAnimations', Copy) {
    from layout.projectDirectory.file("src/main/resources/assets/${mod_id}/player_animations/casting_animations.json")
    into layout.projectDirectory.dir("src/main/resources/assets/${mod_id}/animations")
}

tasks.classes.dependsOn(tasks.copyAnimations)
tasks.processResources.dependsOn(tasks.copyAnimations)
tasks.sourcesJar.dependsOn(tasks.copyAnimations)

publishMods {
    def loader = "fabric"
    def projectCurseforge = "855414"
    def projectModrinth = "s4OWxYQQ"
    def slug = "irons-spells-n-spellbooks"
    def latestChangesContent = rootProject.file("LATEST_CHANGES.MD").text

    displayName = "v${mod_id}-${mod_version}"
    changelog = """
https://iron.wiki/changelog
""".stripMargin().trim()
    // STABLE | BETA | ALPHA
    type = STABLE
    modLoaders.add(loader)
    file = tasks.jar.archiveFile

    curseforge {
        accessToken = System.getenv("CURSEFORGE_PUBLISH")
        projectId = projectCurseforge
        projectSlug = slug
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
    }
    modrinth {
        accessToken = System.getenv("MODRINTH_PUBLISH")
        projectId = projectModrinth
        minecraftVersions.add(minecraft_version)
        environment = CLIENT_AND_SERVER
    }

}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}