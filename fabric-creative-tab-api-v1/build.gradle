plugins {
	id "java-library"
	id "net.fabricmc.fabric-loom-remap" version '1.19-SNAPSHOT'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
	splitEnvironmentSourceSets()

//	accessWidenerPath = file('src/main/resources/fabric-creative-tab-api-v1.classtweaker')

	mods {
		"fabric-creative-tab-api-v1" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.withType(ProcessResources).configureEach {
	def modVersion = project.version.toString()
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

java {
	withSourcesJar()
}
